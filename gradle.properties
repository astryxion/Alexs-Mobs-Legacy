# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Norton's HTTPS scanner uses a root Java does not trust. This store is the JDK cacerts plus that root.
systemProp.javax.net.ssl.trustStore=C:/Users/tinop/.gradle/truststore.jks
systemProp.javax.net.ssl.trustStorePassword=changeit
systemProp.net.minecraftforge.gradle.test_certs=false